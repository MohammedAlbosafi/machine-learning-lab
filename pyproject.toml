[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-recognition"
version = "0.1.0"
description = "Handwritten digit recognition with the scikit-learn Digits dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.6,<2", "numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
